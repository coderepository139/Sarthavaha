# Netlify hosts everything:
#   /            the Sarthavaha home page (React, built by Vite into dist/)
#   /console/    the AdPilot console (public/console, copied into dist/ by Vite)
#   /api/*       the AdPilot API as Netlify Functions (netlify/functions, code in adpilot/server)
# Data and sign-in use the Firebase project in firebase-applet-config.json.

[build]
  command = "npx vite build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # Ship firebase-admin as a normal package: Firestore loads protocol files at runtime.
  external_node_modules = ["firebase-admin"]

# The console is its own single-page app; its pages use #hash routes.
[[redirects]]
  from = "/console/*"
  to = "/console/index.html"
  status = 200

# Sarthavaha single-page app: /privacy, /terms and any other path load index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
